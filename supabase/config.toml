project_id = "qally"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "3MiB"

[storage.buckets.evidencias]
public = false
file_size_limit = "3MiB"
allowed_mime_types = ["application/pdf"]

[storage.vector]
enabled = false

[storage.analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
enable_refresh_token_rotation = true

[auth.email]
# Mantener proveedor email activo; el registro público se bloquea en [auth].
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
# Solo entorno local: permite repetir las pruebas sin enviar correos reales.
sign_in_sign_ups = 1000

[edge_runtime]
enabled = false

[analytics]
enabled = false
